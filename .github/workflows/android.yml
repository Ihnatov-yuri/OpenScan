name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-configuration-cache

      - name: Rename APK
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenScan-debug.apk

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openscan-debug-apk
          path: dist/OpenScan-debug.apk
          if-no-files-found: error

      # Publish the APK as a Release asset so it can be installed directly from
      # a phone browser (no unzip needed). Updates a single rolling pre-release.
      - name: Publish APK to a rolling release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: OpenScan debug (latest build)
          body: |
            Latest debug APK built from `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Install on a phone: open this page on the device, download
            **OpenScan-debug.apk**, and allow installs from your browser.
            Requires Google Play Services for scanning and OCR.
          prerelease: true
          files: dist/OpenScan-debug.apk
